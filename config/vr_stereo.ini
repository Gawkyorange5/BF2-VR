[openxr]
enable=1
srgb=1

[hands]
enable=1

[performance]
; Resolve current eye pixels directly into the transfer atlas when supported.
; Set to 0 and restart to use the original separate resolve/pack path.
direct_eye_atlas=1
; Preview: direct read of the staging atlas on driver-reported UMA adapters.
; Native resolution/MSAA unchanged. 0 restores GetRenderTargetData; restart.
uma_direct_readback=1
; r21 diagnostic sample: one pair in 32; set 0 to disable.
draw_profiling=0
; Startup options; restart BF2 after editing. These default to 1 if omitted.
; Transfer at native game image size when smaller than XR recommended size.
native_eye_transfer=1
; Draw the isolated mono HUD once per stereo pair. 0 restores two draws.
single_hud_pass=1
; Batch both eyes and the HUD into one image transfer. 0 restores r16 transfers.
batch_transfer=1
; Write the transfer atlas through a dynamic upload mapping. 0 uses r17 upload.
dynamic_upload=1
; Reject unrelated body draw packets before looking up the local player.
fast_body_filter=1
; Sparse, nonblocking GPU timings for performance diagnosis; 0 disables.
gpu_timing=0
; Clean OpenXR does not use the old RFX MainLoop.con scripting callback.
; Set 1 only if you use a custom RFX Common/Scripts/MainLoop.con script.
legacy_script_loop=0
; Interval for discovering replacement Flash menu objects, not mouse input.
; 0 restores the previous every-idle-poll lookup. Range 0-250 ms.
menu_poll_ms=100

[reload]
; Live setting: manual gestures when on, B automatic reload when off.
; B ejects supported pistol magazines in manual mode. Vehicles unchanged.
manual=1
; Align nearby detachable magazines to their insertion path; push in to seat.
magazine_guide=1
; 0 off; 1 required when empty, optional otherwise; 2 required every reload.
; Supported handles can also be racked on a loaded rifle without reloading.
; Startup setting; restart BF2 after changing it. Default is 1.
charging_handle=1
; Action-timed sounds. Set sounds=0 for stock automatic sound timing.
sounds=1
; New cue amplitude multiplier, 0-2. Does not change Windows/game volume.
sound_volume=1.0

[cinema]
scale=0.62
distance=2.15
pointer_lift=0.12
pointer_pixels=9

[tracking]
units_per_meter=1.0

[input]
; smooth_turn and turn_speed reload during play within 0.5 seconds (r44+).
; 1 = smooth right-stick turning; 0 = physical turning only
smooth_turn=1
; Numeric range 10-1500, default 240. Use BF2-VR-Settings.exe to adjust.
; Relative mouse counts per second at full deflection. Increase for faster turning.
; Actual angular speed also depends on BF2 mouse sensitivity and Windows settings.
turn_speed=240
turn_deadzone=0.22
move_deadzone=0.25

; These sections reload during play (within 0.5 seconds).
[hud]
; 0 hides the gun-following marker; the old fixed infantry crosshair stays hidden.
gun_crosshair=1
hide_crosshair_at_sights=1
; Lower hides later/closer; 100 reproduces r84, range 25-150.
crosshair_hide_sensitivity=70
; Smaller scale fits more of the canvas into your view; independent of zoom.
scale=0.85
; Perceived panel distance in metres. Angular size is controlled by scale.
depth=12
vertical_fov=60

[vehicle]
head_aim=1
head_gain=4000
head_max_speed=900
invert_head_pitch=0
gunner_position_lock=1
aim_stick_speed=75
; Mouse counts/second at full right-stick deflection (pitch and roll).
flight_speed=300
invert_flight_pitch=0

[body]
; Experimental: submit a separate native torso/legs mesh alongside the tracked arms.
; Set to 1 to try it; restore to 0 if the body or first-person arms look wrong.
show_native_full_body=0
; Connected 3P arms; 0 keeps the 1P arms with the extra torso.
use_native_arms=1
; Retain body depth for the weapon pass so arms can hide the gun.
weapon_depth=1
; Keep detailed 1P hands and native finger poses on connected 3P sleeves.
; Set to 0 to use the r7 third-person hands instead.
high_detail_hands=1
